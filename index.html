<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Petrokima">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Petrokima</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f9;--card:#fff;--line:#e3e7ef;--text:#15192a;--muted:#6b7389;--brand:#1f4fb5;--brand2:#0f9d7a;--danger:#d23b3b;--warn:#c06a17;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;
  padding-top:env(safe-area-inset-top,0px)}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px}
.screen{display:none;min-height:100%}
.screen.on{display:block}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(20,30,60,.06);padding:18px;margin-bottom:14px}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
h1{font-size:22px;font-weight:800;text-align:center}
.sub{color:var(--muted);font-size:13px;text-align:center;margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field textarea{min-height:90px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:var(--brand)}
.btn:disabled{opacity:.55}
.btn.green{background:var(--brand2)} .btn.red{background:var(--danger)} .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn.small{padding:10px 14px;font-size:14px;width:auto;border-radius:10px}
.row{display:flex;gap:10px}
.err{background:#fdecec;color:var(--danger);border-radius:12px;padding:11px 13px;font-size:14px;margin-top:12px;display:none;line-height:1.6}
.muted{color:var(--muted)}
/* top bar + tabs */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.top .who{flex:1;min-width:0}
.top .name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{font-size:12px;color:var(--muted)}
.iconbtn{background:var(--bg);color:var(--text);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:700}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;background:none;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ic{font-size:21px;line-height:1.1}
.tab.on{color:var(--brand);background:#eef3ff}
/* clock card */
.clock{text-align:center;padding:22px 18px}
.clock .time{font-size:44px;font-weight:800;letter-spacing:1px;direction:ltr}
.clock .date{color:var(--muted);font-size:14px;margin-bottom:14px}
.state{border-radius:14px;padding:14px;margin:6px 0 16px;font-size:15px;line-height:1.6}
.state.off{background:#f1f3f8;color:var(--muted)}
.state.on{background:#e6f7f2;color:#08694f}
.state.warn{background:#fff4e5;color:var(--warn)}
.state b{color:inherit}
.big{font-size:18px;padding:18px}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:none}
.it .grow{flex:1;min-width:0}
.it .t1{font-weight:700;font-size:14.5px}
.it .t2{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:700}
.sec{font-weight:800;font-size:15px;margin:4px 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.c-green{background:#e3f6ef;color:#08694f}.c-orange{background:#fff1dd;color:#9a5410}.c-red{background:#fde8e8;color:#b02a2a}.c-grey{background:#eef0f4;color:#5c6478}.c-blue{background:#e8efff;color:#1f4fb5}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:end}
/* bottom sheet */
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:50;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-box{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:14px}
.site{display:block;width:100%;text-align:start;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--text)}
.site b{display:block;font-size:14.5px}.site span{font-size:12.5px;color:var(--muted)}
.site.sel{outline:2px solid var(--brand);background:#eef3ff}
.hint{font-size:13px;color:var(--muted);line-height:1.7;margin:-4px 0 14px}
.hint b{color:var(--text)}
.neg{color:var(--danger)}.pos{color:#08694f}
#toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:#15192a;color:#fff;border-radius:14px;padding:13px 16px;font-size:14.5px;font-weight:600;text-align:center;
  transform:translateY(30px);opacity:0;pointer-events:none;transition:all .25s}
#toast.on{transform:none;opacity:1}
#toast.bad{background:var(--danger)}
#offline{display:none;background:var(--warn);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spinning{animation:sp .8s linear infinite}
.loading{display:flex;justify-content:center;padding:40px}
.loading .spin{border-color:var(--line);border-top-color:var(--brand)}
</style>
</head>
<body>
<div id="offline" data-t="offline"></div>

<!-- LOGIN -->
<section class="screen" id="scr-login"><div class="center"><div style="width:100%;max-width:400px">
  <div class="logo">PK</div><h1 data-t="appName"></h1><div class="sub" data-t="loginSub"></div>
  <div class="card" style="margin-top:22px">
    <div class="field"><label data-t="empCode"></label><input id="li-code" inputmode="text" autocomplete="username" autocapitalize="off"></div>
    <div class="field"><label data-t="password"></label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <button class="btn" id="li-go" data-t="signIn"></button>
    <div class="err" id="li-err"></div>
  </div>
  <div class="sub" style="margin-top:6px"><button class="iconbtn" data-lang>English</button></div>
  <div class="sub" style="margin-top:12px" data-t="forgot"></div>
</div></div></section>

<!-- FIRST SIGN-IN -->
<section class="screen" id="scr-first"><div class="center"><div style="width:100%;max-width:400px">
  <div class="logo">PK</div><h1 data-t="firstTitle"></h1><div class="sub" data-t="firstSub"></div>
  <div class="card" style="margin-top:22px">
    <div class="field"><label data-t="nid4"></label><input id="fl-nid" inputmode="numeric" maxlength="4" autocomplete="off" style="direction:ltr;text-align:center;letter-spacing:6px;font-size:20px"></div>
    <div class="field"><label data-t="newPass"></label><input id="fl-p1" type="password" autocomplete="new-password"></div>
    <div class="field"><label data-t="repeatPass"></label><input id="fl-p2" type="password" autocomplete="new-password"></div>
    <button class="btn" id="fl-go" data-t="savePass"></button>
    <div class="err" id="fl-err"></div>
  </div>
  <button class="btn ghost" data-act="signout" data-t="signOut"></button>
</div></div></section>

<!-- INSTALL FIRST (iPhone) -->
<section class="screen" id="scr-install"><div class="center"><div style="width:100%;max-width:400px;text-align:center">
  <div class="logo">PK</div><h1 data-t="installTitle"></h1>
  <div class="card" style="margin-top:18px;text-align:start;line-height:1.9"><div data-t="installText" style="margin-bottom:10px"></div><div id="ios-steps" style="white-space:pre-line;font-weight:700"></div></div>
  <button class="iconbtn" data-lang>English</button>
</div></div></section>

<!-- MESSAGE (no access etc.) -->
<section class="screen" id="scr-msg"><div class="center"><div style="width:100%;max-width:400px;text-align:center">
  <div class="logo">PK</div><div class="card" id="msg-body" style="line-height:1.8"></div>
  <button class="btn ghost" data-act="signout" data-t="back"></button>
</div></div></section>

<!-- MAIN -->
<section class="screen" id="scr-main">
  <div class="top">
    <div class="who"><div class="name" id="me-name"></div><div class="meta" id="me-meta"></div></div>
    <button class="iconbtn" data-act="refresh" id="btn-refresh" style="display:flex;align-items:center;gap:5px;background:#eef3ff;color:var(--brand)"><span id="rf-ic" style="display:inline-block;font-size:16px">⟳</span><span data-t="refresh"></span></button>
    <button class="iconbtn" data-lang>English</button>
  </div>
  <div id="ptr" style="height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;color:var(--brand);transition:height .15s"><span id="ptr-ic">⟳</span><span id="ptr-tx"></span></div>
  <main>
    <!-- HOME -->
    <div class="view on" id="v-home">
      <div class="card clock">
        <div class="time" id="clk-time">--:--</div>
        <div class="date" id="clk-date"></div>
        <div id="clk-upd" style="font-size:12px;color:var(--muted);margin:-8px 0 10px"></div>
        <div id="clk-state"></div>
        <div id="clk-btns"></div>
        <div class="muted" style="font-size:12px;margin-top:12px" data-t="locNote"></div>
      </div>
      <div class="card"><div class="sec" data-t="today"></div><div class="list" id="today-list"></div></div>
      <div class="card"><div class="sec" id="month-title"></div><div class="list" id="month-list"></div></div>
    </div>
    <!-- REQUESTS -->
    <div class="view" id="v-req">
      <div class="stats" id="req-stats"></div>
      <div style="display:grid;gap:10px;margin-bottom:14px">
        <button class="btn" data-act="req-leave">🌴 <span data-t="reqLeave"></span></button>
        <button class="btn" data-act="req-perm">✋ <span data-t="reqPerm"></span></button>
        <button class="btn ghost" data-act="req-hr">📨 <span data-t="reqOther"></span></button>
      </div>
      <div class="card"><div class="sec" data-t="myRequests"></div><div class="list" id="req-list"></div></div>
    </div>
    <!-- TEAM APPROVALS (managers) -->
    <div class="view" id="v-team"><div class="card"><div class="sec" data-t="teamReqTitle"></div><div class="list" id="treq-list"></div></div>
      <div class="card"><div class="sec" data-t="teamTitle"></div><div class="hint" data-t="teamNote"></div><div class="list" id="team-list"></div></div></div>
    <!-- PAYSLIPS -->
    <div class="view" id="v-pay"><div class="card"><div class="sec" data-t="payslips"></div><div class="list" id="pay-list"></div></div></div>
    <!-- PROFILE -->
    <div class="view" id="v-prof">
      <div class="card" id="prof-card"></div>
      <div class="card" id="install-card" style="display:none"></div>
      <div style="display:grid;gap:10px">
        <button class="btn ghost" data-act="chpass">🔑 <span data-t="changePass"></span></button>
        <button class="btn red" data-act="signout" data-t="signOut"></button>
      </div>
    </div>
  </main>
  <nav class="tabbar">
    <button class="tab on" data-view="home"><span class="ic">⏱</span><span data-t="home"></span></button>
    <button class="tab" data-view="req"><span class="ic">📋</span><span data-t="requests"></span></button>
    <button class="tab" data-view="team" id="tab-team" style="display:none;position:relative"><span class="ic">✅</span><span data-t="approvals"></span><span id="team-badge" style="display:none;position:absolute;top:2px;inset-inline-end:14px;background:var(--danger);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px"></span></button>
    <button class="tab" data-view="pay"><span class="ic">💰</span><span data-t="payslips"></span></button>
    <button class="tab" data-view="prof"><span class="ic">👤</span><span data-t="profile"></span></button>
  </nav>
</section>

<div class="sheet" id="sheet"><div class="sheet-box"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div id="toast"></div>
<div id="boot" class="loading"><div class="spin"></div></div>

let LANG = localStorage.getItem('pk_lang') || 'ar';   // Arabic by default; one tap switches to English
const t = (k, vars) => { let s = (T[LANG][k] ?? T.en[k] ?? k); if (vars) Object.entries(vars).forEach(([a,b]) => s = s.replace('{'+a+'}', b)); return s; };
const tm = (group, k) => (T[LANG][group] && T[LANG][group][k]) || k;
function applyLang(){
  document.documentElement.lang = LANG; document.documentElement.dir = LANG==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-lang]').forEach(el => el.textContent = t('langBtn'));
  if ($('ios-steps')) $('ios-steps').textContent = t('iosSteps');
  if (APP.ready) renderAll();
}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2,'0');
const loc = () => LANG==='ar' ? 'ar-EG' : 'en-GB';
const fmt = v => num(v).toLocaleString(loc(), { maximumFractionDigits:2 });
const fmtH = v => num(v).toLocaleString(loc(), { maximumFractionDigits:2 }) + ' ' + t('hours');
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dObj(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y, m-1, d); }
function dStr(o){ return `${o.getFullYear()}-${pad(o.getMonth()+1)}-${pad(o.getDate())}`; }
function niceDate(s){ return s ? dObj(s).toLocaleDateString(loc(), { weekday:'short', day:'numeric', month:'short' }) : ''; }
function toMin(x){ const [h,m]=String(x||'0:0').split(':').map(Number); return h*60+m; }
let toastT;
function toast(msg, bad){ const el=$('toast'); el.textContent=msg; el.className = 'on' + (bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>el.className='',3200); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); $('boot').style.display='none'; }
function sheet(html){ $('sheet-body').innerHTML = html; $('sheet').classList.add('on'); }
function closeSheet(){ $('sheet').classList.remove('on'); }
function chip(s){ const c={Pending:'c-orange','Waiting for manager':'c-orange','Waiting for HR':'c-blue',Approved:'c-green',Completed:'c-green','In progress':'c-blue',Rejected:'c-red',Cancelled:'c-grey'}[s]||'c-grey'; return `<span class="chip ${c}">${esc(tm('st',s))}</span>`; }
function friendly(msg){
  msg = String(msg||'');
  if (/LATE_REQUEST/.test(msg)) return t('lateReqErr', { time: (msg.match(/before (\d\d:\d\d)/) || [])[1] || lateDeadline() });
  if (/ADVANCE_NOTICE/.test(msg)) return t('annualNoticeErr', { n: Number(S.annualNoticeDays) || 1 });
  if (/PAST_DATE/.test(msg)) return t('pastDateErr');
  if (/OFFLINE_TOO_OLD/.test(msg)) return t('tooOld');
  if (/OFFLINE_ORDER/.test(msg)) return t('wrongOrder');
  if (/ALREADY_IN/.test(msg)) return t('alreadyIn');
  if (/NOT_IN/.test(msg)) return t('notInErr');
  if (/DEVICE/.test(msg)) return t('deviceMismatch');
  if (/NO_LOCATION/.test(msg)) return t('locDenied');
  if (/approved and locked/i.test(msg)) return t('lockedPeriod');
  if (/Failed to fetch|NetworkError|network/i.test(msg)) return t('offline');
  return msg.replace(/^[A-Z_]+:\s*/, '');
}

// Payroll rules shared with the HR system
let S = { weekendDays:[5,6], cycleStartDay:21, permissionsPerMonth:2, permissionMaxHours:2, annualLeaveDefault:21, casualCountsAnnual:'yes', hoursPerDay:8 };
let HOL = new Set();
function isWorkday(s){ return !(S.weekendDays||[]).includes(dObj(s).getDay()) && !HOL.has(s); }
function workdays(a,b){ if(!a||!b||b<a) return 0; let n=0,d=dObj(a),e=dObj(b),g=0; while(d<=e && g++<800){ if(isWorkday(dStr(d))) n++; d.setDate(d.getDate()+1); } return n; }
function cycleDay(){ const d=Math.round(num(S.cycleStartDay)); return (d>=2&&d<=28)?d:1; }
function periodStart(p){ const sd=cycleDay(),[y,m]=p.split('-').map(Number); if(sd===1) return `${p}-01`; const d=new Date(y,m-2,sd); return dStr(d); }

    if (perm.location === 'denied') return { err:1 };
    const p = await G.getCurrentPosition({ enableHighAccuracy:true, timeout: navigator.onLine ? 15000 : 30000, maximumAge:60000 });
    return { lat:p.coords.latitude, lng:p.coords.longitude, accuracy:Math.round(p.coords.accuracy) };
  } catch(e){
    const m = String((e && (e.message || e.code)) || e);

  }

}

  const pendingBefore = queue().length;
  if (navigator.onLine && !pendingBefore){
    if (btn){ btn.disabled = true; btn.innerHTML = `<div class="spin"></div> ${esc(t('sending'))}`; }
    const res = await withTimeout(sb.from('clock_events').insert(rec), 15000);
    if (btn){ btn.disabled = false; btn.textContent = label; }
    if (!res.error){ closeSheet(); try { await loadStatus(); } catch(e){} renderHome(); return toast(type==='out' ? t('doneOut') : wasOpen ? t('doneSwitch') : t('doneIn')); }
    if (!serverDown(res)) return toast(friendly(res.error.message), true);          // a real refusal (wrong site, no location…) — tell the employee
  }

  const q = queue();

// Show saved-but-unsent check-ins on the home screen as if they were already recorded

function applyEvent(st, ev){
  if (!st) return; st.today = st.today || [];
  const p = localParts(new Date(ev.client_at).getTime() + clockOffset());
  const close = () => { if (st.open){ const seg = st.today.find(x => x.in === st.open.in && (x.code||'') === (st.open.code||'') && !x.out); if (seg){ seg.out = p.time; seg.hours = Math.max(0, (toMin(p.time)-toMin(seg.in))/60); } st.open = null; } };
  if (ev.event_type === 'in'){ close(); const seg = { code: ev.project_code || '', name: ev._name || null, in: p.time, out: null, hours: 0, pending: true };
    st.today.push(seg); st.open = { ...seg, date: p.date }; }

async function doRefresh(){

// Pull down on the screen to refresh (the iPhone home-screen app has no built-in pull-to-refresh)
(function pullToRefresh(){
  let y0 = null, dy = 0;
  const ptr = () => $('ptr'), sheetOpen = () => $('sheet').classList.contains('on');
  document.addEventListener('touchstart', e => { if (!APP.ready || sheetOpen() || window.scrollY > 0 || !$('scr-main').classList.contains('on')) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; }, { passive:true });
  document.addEventListener('touchmove', e => { if (y0 === null) return; dy = e.touches[0].clientY - y0; if (dy <= 0) { ptr().style.height='0'; return; }
    const h = Math.min(70, dy * 0.5); ptr().style.height = h + 'px'; $('ptr-tx').textContent = dy > 110 ? t('release') : t('pull'); $('ptr-ic').style.transform = `rotate(${dy*2}deg)`; }, { passive:true });
  document.addEventListener('touchend', async () => { if (y0 === null) return; const go = dy > 110; y0 = null;
    if (!go) { ptr().style.height='0'; return; }
    $('ptr-tx').textContent = t('refreshing'); $('ptr-ic').classList.add('spinning');
    await doRefresh(); $('ptr-ic').classList.remove('spinning'); ptr().style.height='0'; });
})();
let flushing = false;
async function flushQueue(){
  if (flushing || !navigator.onLine || !sb || !APP.me) return;
  let q = queue(); if (!q.length || q[0]._err) return;
  flushing = true; let sent = 0, failed = false;
  try {
    while (q.length && !q[0]._err){
      const { _name, _err, _off, _applied, ...rec } = q[0];
      const res = await withTimeout(sb.from('clock_events').insert({ ...rec, device_now: new Date().toISOString() }), 15000);   // the server compares the clocks
      const error = res.error;
      if (error && alreadyHave(error)) { q.shift(); store.set('pk_queue', q); sent++; continue; }   // it arrived earlier — the answer was lost
      if (error && serverDown(res)) break;                                  // still no connection / server still down: try later
      if (error){ q[0]._err = friendly(error.message); store.set('pk_queue', q); failed = true; break; }   // keep it visible, stop here
      q.shift(); store.set('pk_queue', q); sent++;
    }
  } catch(e){ /* offline again — everything stays saved */ }
  flushing = false;
  if (sent || failed){
    try { await loadStatus(); } catch(e){}
    renderHome();
    toast(failed ? t('notRecorded') : t('sentNow', { n: sent }), failed);
  }
}

    const what = kind==='leave' ? `🌴 ${t('leaveTitle',{ t: tm('lt', r.leave_type) })}` : `✋ ${tm('pt', r.type)}`;
    const when = kind==='leave' ? `${niceDate(r.date_from)} → ${niceDate(r.date_to)} · ${fmt(r.days)} ${t('days')}` : `${niceDate(r.date)} · ${fmt(r.hours)} ${t('hours')}`;
    return `<div class="it" style="align-items:flex-start"><div class="grow"><div class="t1">${esc(r.emp_name || r.emp_id)} <span class="muted" style="font-size:12px">${esc(r.emp_id)}</span></div>
      <div class="t2">${esc(what)} · ${esc(when)}</div><div class="t2" style="font-size:12px">🕒 ${esc(t('sentAt'))} ${esc(sentAt(r.created_at || r.requested_at))}</div>${r.reason ? `<div class="t2">💬 ${esc(r.reason)}</div>` : ''}
      <div style="margin-top:6px">${chip(mine ? 'Pending' : stg==='Waiting for HR' ? 'Waiting for HR' : r.status)}</div>
      ${mine ? `<div class="row" style="margin-top:10px"><button class="btn green small" style="flex:1" data-treq-ok="${kind}:${r.id}">✓ ${esc(t('approve'))}</button><button class="btn ghost small" style="flex:1" data-treq-no="${kind}:${r.id}">✕ ${esc(t('reject'))}</button></div>` : ''}</div></div>`; }).join('')
    || `<div class="empty">${esc(t('noTeamReq'))}</div>`;
  $('team-badge').style.display = waiting ? '' : 'none'; $('team-badge').textContent = waiting;
  const st = { 'Pending manager':['c-orange','aaWait'], 'Pending HR':['c-blue','aaHR'], 'Approved':['c-green','aaOk'], 'Rejected':['c-red','aaNo'] };
  $('team-list').innerHTML = team.map(a => { const c = st[a.status] || ['c-grey','aaNo'];
    return `<div class="it" style="align-items:flex-start"><div class="grow"><div class="t1">${esc(a.emp_name || a.emp_id)} <span class="muted" style="font-size:12px">${esc(a.emp_id)}</span></div>
      <div class="t2">${esc(periodLabel(a.period))}${a.job_name ? ' · ' + esc(a.job_name) : ''}</div>
      <div class="t2">${(a.details||[]).map(x => `${x.days} ${x.days===1?t('day'):t('daysW')} × <span class="num">${fmt(x.rate)}</span> ${t('at')} ${esc(x.project_name || x.project)}`).join('<br>')}</div>
      <div style="margin-top:6px"><span class="chip ${c[0]}">${esc(t(c[1]))}</span></div>
      ${a.status==='Pending manager' ? `<div class="row" style="margin-top:10px"><button class="btn green small" style="flex:1" data-team-ok="${a.id}">✓ ${esc(t('approve'))}</button><button class="btn ghost small" style="flex:1" data-team-no="${a.id}">✕ ${esc(t('reject'))}</button></div>` : ''}</div>
      <div class="num" style="font-size:17px">${fmt(a.amount)}</div></div>`; }).join('') || `<div class="empty">${esc(t('noTeam'))}</div>`;
}
async function teamReqDecide(key, approve, note){
  if (!navigator.onLine) return toast(t('offline'), true);
  const [kind, id] = key.split(':');
  const { data, error } = await sb.rpc('manager_decide_request', { p_kind:kind, p_id:id, p_approve:approve, p_note: note || null });
  if (error) return toast(friendly(error.message), true);
  closeSheet(); toast(!approve ? t('rejectedMsg') : /final/.test(data||'') ? t('approvedFinal') : t('approvedMsg'));
  await loadAll(); renderAll();
}
async function teamDecide(id, approve, note){
  if (!navigator.onLine) return toast(t('offline'), true);
  const { error } = await sb.rpc('manager_decide_allowance', { p_id:id, p_approve:approve, p_note: note || null });
  if (error) return toast(friendly(error.message), true);
  closeSheet(); toast(approve ? t('approvedMsg') : t('rejectedMsg'));
  const r = await sb.from('allowance_approvals').select('*').eq('manager_id', APP.me.emp_id).order('submitted_at', { ascending:false });
  APP.team = r.data || APP.team; saveCache(); renderTeam();
}
async function checkAppUpdate(){
  if (!NATIVE || PLATFORM !== 'android' || !APK_REPO || !APP_BUILD || !navigator.onLine) return;
  try {
    const r = await fetch(`https://api.github.com/repos/${APK_REPO}/releases/latest`, { headers:{ Accept:'application/vnd.github+json' } });
    if (!r.ok) return;
    const j = await r.json(), latest = Number(String(j.tag_name || '').split('.').pop());
    if (latest > APP_BUILD && !$('upd-bar')){
      document.body.insertAdjacentHTML('afterbegin', `<div id="upd-bar" style="background:var(--brand);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;padding-top:calc(10px + env(safe-area-inset-top,0px))">
        <span style="flex:1">⬆ ${esc(t('updateAvail'))}</span><a href="https://github.com/${APK_REPO}/releases/latest/download/Petrokima.apk" style="background:#fff;color:var(--brand);padding:7px 12px;border-radius:10px;text-decoration:none">${esc(t('updateBtn'))}</a></div>`);
    }
  } catch(e){}
}
function renderAll(){ if(!APP.ready) return; const e=APP.emp||{};
  $('me-name').textContent = LANG==='ar' ? (e.name_ar||e.name_en||APP.me.full_name||'') : (e.name_en||e.name_ar||APP.me.full_name||'');
  $('me-meta').textContent = `${APP.me.emp_id}${e.job_name?' · '+e.job_name:''}`;
  renderHome(); renderRequests(); renderTeam(); renderPayslips(); renderProfile(); }
function go(view){ APP.view=view; document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+view)); document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.view===view)); window.scrollTo(0,0); }

// ═════════════════════════════════════════════════════════
//  EVENTS & START-UP
// ═════════════════════════════════════════════════════════
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (APP.ready) renderProfile(); });
document.addEventListener('click', async ev => {
  const x = ev.target;
  if (x.closest('[data-lang]')) { LANG = LANG==='ar' ? 'en' : 'ar'; localStorage.setItem('pk_lang', LANG); return applyLang(); }
  const tab = x.closest('[data-view]'); if (tab) return go(tab.dataset.view);
  if (x === $('sheet')) return closeSheet();
  const s = x.closest('.site'); if (s) return selectSite(s);
  const sl = x.closest('[data-slip]'); if (sl) return slipSheet(sl.dataset.slip);
  const cx = x.closest('[data-cancel]'); if (cx) return askCancel(cx.dataset.cancel);
  const rok = x.closest('[data-treq-ok]'); if (rok) { rok.disabled = true; return teamReqDecide(rok.dataset.treqOk, true); }
  const rno = x.closest('[data-treq-no]'); if (rno) { const key = rno.dataset.treqNo;
    sheet(`<h2>✕ ${esc(t('reject'))}</h2><div class="field"><label>${esc(t('rejectWhy'))}</label><textarea id="rno-note"></textarea></div>
      <div class="row"><button class="btn ghost" data-act="close">${esc(t('cancel'))}</button><button class="btn red" id="rno-go">${esc(t('reject'))}</button></div>`);
    $('rno-go').onclick = () => teamReqDecide(key, false, $('rno-note').value.trim()); return; }
  const tok = x.closest('[data-team-ok]'); if (tok) { tok.disabled = true; return teamDecide(tok.dataset.teamOk, true); }
  const tno = x.closest('[data-team-no]'); if (tno) { const id = tno.dataset.teamNo;
    sheet(`<h2>✕ ${esc(t('reject'))}</h2><div class="field"><label>${esc(t('rejectWhy'))}</label><textarea id="tno-note"></textarea></div>
      <div class="row"><button class="btn ghost" data-act="close">${esc(t('cancel'))}</button><button class="btn red" id="tno-go">${esc(t('reject'))}</button></div>`);
    $('tno-go').onclick = () => teamDecide(id, false, $('tno-note').value.trim()); return; }
  if (x.id === 'site-go' && pickSel) return clock('in', pickSel.code, x);
  if (x.id === 'disc-go') { store.set('pk_queue', queue().filter(ev => ev.client_id !== x.dataset.id)); closeSheet(); try { await loadStatus(); } catch(e){} return renderHome(); }
  const dsc = x.closest('[data-discard]'); if (dsc) return discardSaved(dsc.dataset.discard);
  if (x.id === 'noproj-go') return clock('in', null, x);
  const nph = x.closest('#noproj-home'); if (nph) return clock('in', null, nph);
  if (x.id === 'out-go') return clock('out', null, x);
  const a = x.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act==='in' || act==='switch') return openSitePicker(act);
  if (act==='out') return confirmOut();
  if (act==='close') return closeSheet();
  if (act==='sync') return flushQueue();
  if (act==='refresh') return doRefresh();
  if (act==='req-leave') return leaveSheet();
  if (act==='req-perm') return permSheet();
  if (act==='req-hr') return hrSheet();
  if (act==='chpass') return passSheet();
  if (act==='signout') return signOut();
  if (act==='install' && installEvt) { installEvt.prompt(); installEvt = null; return; }
});
$('li-go').addEventListener('click', doLogin);
['li-code','li-pass'].forEach(i => $(i).addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); }));
$('fl-go').addEventListener('click', firstLogin);
const net = () => { $('offline').style.display = navigator.onLine ? 'none' : 'block'; if (navigator.onLine && APP.ready) flushQueue().then(()=>{ if (APP.offline) loadAll().then(renderAll).catch(()=>{}); }); };
window.addEventListener('online', net); window.addEventListener('offline', net);
document.addEventListener('visibilitychange', async () => { if (document.visibilityState==='visible' && APP.ready && navigator.onLine){ await flushQueue(); try { await loadStatus(); } catch(e){} renderHome(); } });
setInterval(() => { if (APP.ready) tick(); }, 15000);
setInterval(() => { if (APP.ready && queue().length && navigator.onLine) flushQueue(); }, 30000);

(async function boot(){
  applyLang(); net();
  if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  if (NATIVE) await restoreDeviceId();
  if (!window.supabase || !SUPABASE_KEY || SUPABASE_KEY.startsWith('PASTE')) return message(t('configMissing'));
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global: { fetch: timedFetch } });
  $('li-code').value = localStorage.getItem('pk_code') || '';
  if (isIOS() && !isStandalone()) { $('ios-steps').textContent = t('iosSteps'); show('scr-install'); return; }
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) await afterLogin(data.session.user); else show('scr-login');
  } catch(e){ console.warn('Petrokima start-up:', e && e.message); const c = store.get('pk_cache', null); if (c && useCache(c.uid)) { show('scr-main'); APP.ready=true; renderAll(); } else show('scr-login'); }
})();
</script>
</body>
</html>
