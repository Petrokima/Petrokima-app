<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://hckkrzghxxhauotyqlqr.supabase.co wss://hckkrzghxxhauotyqlqr.supabase.co https://api.github.com https://download.petrokima-hr.com https://challenges.cloudflare.com; frame-src 'self' blob: https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Petrokima">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=39">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=39">
<title>Petrokima</title>
<link href="fonts/cairo.css?v=5.3.0" rel="stylesheet">
<script src="vendor/sentry.js?v=11.7.0"></script>
<script src="vendor/supabase.js?v=2.117.3"></script>
<style>
:root{--bg:#f3f5f9;--card:#fff;--line:#e3e7ef;--text:#15192a;--muted:#6b7389;--brand:#1f4fb5;--brand2:#0f9d7a;--danger:#d23b3b;--warn:#c06a17;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;
  padding-top:env(safe-area-inset-top,0px)}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px}
.screen{display:none;min-height:100%}
.screen.on{display:block}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(20,30,60,.06);padding:18px;margin-bottom:14px}
.logo{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 12px;box-shadow:0 4px 14px rgba(2,16,43,.18)}
h1{font-size:22px;font-weight:800;text-align:center}
.sub{color:var(--muted);font-size:13px;text-align:center;margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field textarea{min-height:90px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:var(--brand)}
.btn:disabled{opacity:.55}
.btn.green{background:var(--brand2)} .btn.red{background:var(--danger)} .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn.small{padding:10px 14px;font-size:14px;width:auto;border-radius:10px}
.row{display:flex;gap:10px}
.err{background:#fdecec;color:var(--danger);border-radius:12px;padding:11px 13px;font-size:14px;margin-top:12px;display:none;line-height:1.6}
.muted{color:var(--muted)}
/* top bar + tabs */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.top .who{flex:1;min-width:0}
.top .name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{font-size:12px;color:var(--muted)}
.iconbtn{background:var(--bg);color:var(--text);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:700}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;background:none;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ic{font-size:21px;line-height:1.1}
.tab.on{color:var(--brand);background:#eef3ff}
/* clock card */
.clock{text-align:center;padding:22px 18px}
.clock .time{font-size:44px;font-weight:800;letter-spacing:1px;direction:ltr}
.clock .date{color:var(--muted);font-size:14px;margin-bottom:14px}
.state{border-radius:14px;padding:14px;margin:6px 0 16px;font-size:15px;line-height:1.6}
.state.off{background:#f1f3f8;color:var(--muted)}
.state.on{background:#e6f7f2;color:#08694f}
.state.warn{background:#fff4e5;color:var(--warn)}
.state b{color:inherit}
.big{font-size:18px;padding:18px}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:none}
.it .grow{flex:1;min-width:0}
.it .t1{font-weight:700;font-size:14.5px}
.it .t2{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:700}
.sec{font-weight:800;font-size:15px;margin:4px 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.c-green{background:#e3f6ef;color:#08694f}.c-orange{background:#fff1dd;color:#9a5410}.c-red{background:#fde8e8;color:#b02a2a}.c-grey{background:#eef0f4;color:#5c6478}.c-blue{background:#e8efff;color:#1f4fb5}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:end}
/* bottom sheet */
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:50;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-box{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:14px}
.site{display:block;width:100%;text-align:start;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--text)}
.site b{display:block;font-size:14.5px}.site span{font-size:12.5px;color:var(--muted)}
.site.sel{outline:2px solid var(--brand);background:#eef3ff}
.hint{font-size:13px;color:var(--muted);line-height:1.7;margin:-4px 0 14px}
.hint b{color:var(--text)}
.neg{color:var(--danger)}.pos{color:#08694f}
#toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:#15192a;color:#fff;border-radius:14px;padding:13px 16px;font-size:14.5px;font-weight:600;text-align:center;
  transform:translateY(30px);opacity:0;pointer-events:none;transition:all .25s}
#toast.on{transform:none;opacity:1}
#toast.bad{background:var(--danger)}
#offline{display:none;background:var(--warn);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spinning{animation:sp .8s linear infinite}
.loading{display:flex;justify-content:center;padding:40px}
.loading .spin{border-color:var(--line);border-top-color:var(--brand)}
</style>
</head>
<body>
<div id="offline" data-t="offline"></div>

<!-- LOGIN -->
<section class="screen" id="scr-login"><div class="center"><div style="width:100%;max-width:400px">
  <img class="logo" src="icon-192.png?v=39" alt="Petrokima HR"><h1 data-t="appName"></h1><div class="sub" data-t="loginSub"></div>
  <div class="card" style="margin-top:22px">
    <div class="field"><label data-t="empCode"></label><input id="li-code" inputmode="text" autocomplete="username" autocapitalize="off"></div>
    <div class="field"><label data-t="password"></label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <div class="hint" data-t="firstHint" style="margin:-4px 0 10px"></div>
    <div id="li-cap" style="display:none;margin:0 0 10px;min-height:0"></div>
    <button class="btn" id="li-go" data-t="signIn"></button>
    <div class="err" id="li-err"></div>
  </div>
  <div class="sub" style="margin-top:6px"><button class="iconbtn" data-lang>English</button></div>
  <div class="sub" style="margin-top:12px" data-t="forgot"></div>
</div></div></section>

<!-- FIRST SIGN-IN -->
<section class="screen" id="scr-first"><div class="center"><div style="width:100%;max-width:400px">
  <img class="logo" src="icon-192.png?v=39" alt="Petrokima HR"><h1 data-t="firstTitle"></h1><div class="sub" data-t="firstSub"></div>
  <div class="card" style="margin-top:22px">
    <div class="hint" data-t="firstMustChange" style="margin-bottom:10px"></div>
    <div class="field"><label data-t="birthYear"></label><input id="fl-year" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1988" style="direction:ltr;text-align:center;letter-spacing:6px;font-size:20px"></div>
    <div class="field"><label data-t="newPass"></label><input id="fl-p1" type="password" autocomplete="new-password"></div>
    <div class="field"><label data-t="repeatPass"></label><input id="fl-p2" type="password" autocomplete="new-password"></div>
    <button class="btn" id="fl-go" data-t="savePass"></button>
    <div class="err" id="fl-err"></div>
  </div>
  <button class="btn ghost" data-act="signout" data-t="signOut"></button>
</div></div></section>

<!-- INSTALL FIRST (iPhone) -->
<section class="screen" id="scr-install"><div class="center"><div style="width:100%;max-width:400px;text-align:center">
  <img class="logo" src="icon-192.png?v=39" alt="Petrokima HR"><h1 data-t="installTitle"></h1>
  <div class="card" style="margin-top:18px;text-align:start;line-height:1.9"><div data-t="installText" style="margin-bottom:10px"></div><div id="ios-steps" style="white-space:pre-line;font-weight:700"></div></div>
  <button class="iconbtn" data-lang>English</button>
</div></div></section>

<!-- MESSAGE (no access etc.) -->
<section class="screen" id="scr-msg"><div class="center"><div style="width:100%;max-width:400px;text-align:center">
  <img class="logo" src="icon-192.png?v=39" alt="Petrokima HR"><div class="card" id="msg-body" style="line-height:1.8"></div>
  <button class="btn ghost" data-act="signout" data-t="back"></button>
</div></div></section>

<!-- MAIN -->
<section class="screen" id="scr-main">
  <div class="top">
    <div class="who"><div class="name" id="me-name"></div><div class="meta" id="me-meta"></div></div>
    <button class="iconbtn" data-act="refresh" id="btn-refresh" style="display:flex;align-items:center;gap:5px;background:#eef3ff;color:var(--brand)"><span id="rf-ic" style="display:inline-block;font-size:16px">⟳</span><span data-t="refresh"></span></button>
    <button class="iconbtn" data-lang>English</button>
  </div>
  <div id="ptr" style="height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;color:var(--brand);transition:height .15s"><span id="ptr-ic">⟳</span><span id="ptr-tx"></span></div>
  <main>
    <!-- HOME -->
    <div class="view on" id="v-home">
      <div id="bday-box"></div>
      <div id="push-card"></div>
      <div class="card clock">
        <div class="time" id="clk-time">--:--</div>
        <div class="date" id="clk-date"></div>
        <div id="clk-upd" style="font-size:12px;color:var(--muted);margin:-8px 0 10px"></div>
        <div id="clk-state"></div>
        <div id="clk-btns"></div>
        <div class="muted" style="font-size:12px;margin-top:12px" data-t="locNote"></div>
      </div>
      <div id="co-card"></div>
      <div id="sp-card"></div>
      <div class="card"><div class="sec" data-t="today"></div><div class="list" id="today-list"></div></div>
      <div class="card"><div class="sec" id="month-title"></div><div class="list" id="month-list"></div></div>
    </div>
    <!-- REQUESTS -->
    <div class="view" id="v-req">
      <div class="stats" id="req-stats"></div>
      <div style="display:grid;gap:10px;margin-bottom:14px">
        <button class="btn" data-act="req-leave">🌴 <span data-t="reqLeave"></span></button>
        <button class="btn" data-act="req-perm">✋ <span data-t="reqPerm"></span></button>
        <button class="btn ghost" data-act="req-hr">📨 <span data-t="reqOther"></span></button>
        <button class="btn ghost" data-act="req-mission">🚗 <span data-t="reqMission"></span></button>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn ghost" data-act="fb-complaint">⚠️ <span data-t="complaint"></span></button><button class="btn ghost" data-act="fb-suggestion">💡 <span data-t="suggestion"></span></button></div>
      </div>
      <div id="mis-ack"></div>
      <div id="doc-card"></div>
      <div id="dreq-card"></div>
      <div class="card"><div class="sec" data-t="myRequests"></div><div class="list" id="req-list"></div></div>
      <div class="card" id="fb-card" style="display:none"><div class="sec" data-t="myFeedback"></div><div class="list" id="fb-list"></div></div>
    </div>
    <!-- NEWS: announcements & decisions -->
    <div class="view" id="v-news"><div class="card"><div class="sec" data-t="newsTitle"></div><div class="list" id="news-list"></div></div></div>
    <!-- TEAM APPROVALS (managers) -->
    <div class="view" id="v-team">
      <div class="card" id="hra-card" style="display:none"><div class="sec">🔔 <span data-t="hraTitle"></span></div><div class="hint" id="hra-note"></div><div class="list" id="hra-list"></div></div>
      <div class="card" id="board-card" style="display:none"><div class="sec" data-t="boardTitle"></div><div class="list" id="board-list"></div></div>
      <div class="card" id="inbox-card" style="display:none"><div class="sec" data-t="inboxTitle"></div><div class="list" id="inbox-list"></div></div>
      <div class="card" id="treq-card"><div class="sec" data-t="teamReqTitle"></div><div class="list" id="treq-list"></div></div>
      <div class="card" id="tmis-card" style="display:none"><div class="sec" data-t="misTeamTitle"></div>
        <div id="tmis-assign" style="margin-bottom:10px"><button class="btn ghost" data-act="mis-assign">🚗 <span data-t="misAssign"></span></button></div>
        <div class="list" id="tmis-list"></div></div>
      <div class="card" id="mreq-card" style="display:none"><div class="sec" data-t="hrReqTitle"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px"><button class="btn ghost" data-act="req-hire">👥 <span data-t="reqHire"></span></button><button class="btn ghost" data-act="req-train">🎓 <span data-t="reqTrain"></span></button>
          <button class="btn ghost" data-act="req-penalty">⚖️ <span data-t="reqPenalty"></span></button><button class="btn ghost" data-act="req-element">💰 <span data-t="reqElement"></span></button></div>
        <div class="list" id="mreq-list"></div></div>
      <div class="card" id="tproj-card" style="display:none"><div class="sec" data-t="teamProj"></div><div class="hint" data-t="teamProjNote"></div><div class="list" id="tproj-list"></div></div>
      <div class="card"><div class="sec" data-t="teamTitle"></div><div class="hint" data-t="teamNote"></div><div class="list" id="team-list"></div></div></div>
    <!-- PAYSLIPS -->
    <div class="view" id="v-pay"><div class="card"><div class="sec" data-t="payslips"></div><div class="list" id="pay-list"></div></div></div>
    <!-- PROFILE -->
    <div class="view" id="v-prof">
      <div class="card" id="prof-card"></div>
      <div class="card" id="install-card" style="display:none"></div>
      <div style="display:grid;gap:10px">
        <button class="btn ghost" data-act="chpass">🔑 <span data-t="changePass"></span></button>
        <button class="btn red" data-act="signout" data-t="signOut"></button>
      </div>
    </div>
  </main>
  <nav class="tabbar">
    <button class="tab on" data-view="home"><span class="ic">⏱</span><span data-t="home"></span></button>
    <button class="tab" data-view="req"><span class="ic">📋</span><span data-t="requests"></span></button>
    <button class="tab" data-view="news" style="position:relative"><span class="ic">📢</span><span data-t="news"></span><span id="news-badge" style="display:none;position:absolute;top:2px;inset-inline-end:14px;background:#d64545;color:#fff;border-radius:9px;font-size:10px;padding:1px 6px"></span></button>
    <button class="tab" data-view="team" id="tab-team" style="display:none;position:relative"><span class="ic">✅</span><span data-t="approvals"></span><span id="team-badge" style="display:none;position:absolute;top:2px;inset-inline-end:14px;background:var(--danger);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px"></span></button>
    <button class="tab" data-view="pay"><span class="ic">💰</span><span data-t="payslips"></span></button>
    <button class="tab" data-view="prof"><span class="ic">👤</span><span data-t="profile"></span></button>
  </nav>
</section>

<div class="sheet" id="sheet"><div class="sheet-box"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div id="toast"></div>
<div id="boot" class="loading"><div class="spin"></div></div>

<script src="app.js?v=pk-mobile-v49"></script>
</body>
</html>
