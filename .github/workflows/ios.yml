# Builds the Petrokima iPhone app on GitHub's Mac computers (28 Nov 2026 — replaces Codemagic; Mohammed chose GitHub so the Apple keys sit
# next to the Android ones and no other company holds them). This repository is public, so the Mac minutes are free.
#
# TWO KINDS OF RUN
#   · test build (every push, until the Apple secrets exist, and always on test/… and ios/… branches): the app is built for the iPhone
#     SIMULATOR without signing, started on a simulated iPhone, and checked (privacy file, never "Always" location, oldest iOS 16,
#     LocationGuard inside, app still running after 20 seconds). Nothing goes to Apple.
#   · TestFlight build (main only, once ALL FOUR secrets below exist): signed by Apple's own cloud signing with the App Store Connect
#     API key and uploaded to TestFlight. It never goes to the App Store by itself — a person submits it for review and starts the
#     phased release in App Store Connect (see RELEASE-CHECKLIST.md).
# Secrets (Settings → Secrets and variables → Actions), saved by Mohammed only — never in files or chat:
#   APPLE_TEAM_ID       the 10-letter Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID          App Store Connect → Users and Access → Integrations → Team keys: the key's ID
#   ASC_ISSUER_ID       the Issuer ID shown above the keys list
#   ASC_KEY_P8          the downloaded AuthKey_XXXX.p8 file's whole text (it can be downloaded only once)
#   SUPABASE_ANON_KEY   already there for Android (the public database key)
name: Build iPhone app

on:
  push:
    branches: [main, 'test/**', 'ios/**']     # ios/… branches build only the iPhone app (android.yml ignores them)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    name: iPhone
    steps:
      - name: Get the project files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0 — pinned to the exact commit (supply-chain rule)

      - name: Arrange the files into their folders (in case they were uploaded without folders)
        run: |
          mkdir -p scripts web assets
          for f in prepare-web.js patch-android.js patch-ios.js; do if [ -f "$f" ]; then mv -f "$f" scripts/; fi; done
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do if [ -f "$f" ]; then mv -f "$f" web/; fi; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do if [ -f "$f" ]; then mv -f "$f" assets/; fi; done
          for f in scripts/prepare-web.js scripts/patch-ios.js web/index.html assets/icon-only.png assets/splash.png; do
            if [ ! -f "$f" ]; then echo "::error::The file $(basename "$f") is missing from the repository — please upload it"; exit 1; fi
          done

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0 — pinned
        with:
          node-version: 22
          cache: npm

      - name: Choose Xcode 26 or newer (Apple's minimum for every upload since 28 Apr 2026)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_2[7-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          V=$(xcodebuild -version | head -1 | awk '{print $2}'); echo "Xcode $V"
          if [ "${V%%.*}" -lt 26 ]; then echo "::error::Xcode 26 or newer is required by Apple (found $V)"; exit 1; fi

      - name: Which kind of run
        id: kind
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$TEAM" ] && [ -n "$KID" ] && [ -n "$ISS" ] && [ -n "$P8" ]; then
            echo "signed=1" >> "$GITHUB_OUTPUT"; echo "::notice::TestFlight build (signed by Apple's cloud signing, uploaded to TestFlight)"
          else
            echo "signed=" >> "$GITHUB_OUTPUT"; echo "::notice::Test build only (simulator, not signed, nothing sent to Apple)"
          fi

      - name: Install the app libraries
        run: npm ci

      - name: Prepare the app (key, build number — no Android download address, Apple forbids updates outside the App Store)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_BUILD: ${{ github.run_number }}
          APK_REPO: ''
          APK_DOWNLOAD: ''
        run: node scripts/prepare-web.js

      - name: Create the iPhone project
        run: |
          npx cap add ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#02102b' --iconBackgroundColorDark '#02102b' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#02102b'
          node scripts/patch-ios.js
          npx cap sync ios

      - name: Check the project before building
        run: |
          P=ios/App/App/Info.plist
          if grep -q 'NSLocationAlways' "$P"; then echo "::error::The iPhone app must never ask for 'Always' location (Mohammed, 28 Nov 2026)"; exit 1; fi
          if /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$P" 2>/dev/null | grep -q location; then echo "::error::No background location in the iPhone app"; exit 1; fi
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 16.0;' ios/App/App.xcodeproj/project.pbxproj || { echo "::error::The oldest iPhone system must be iOS 16"; exit 1; }
          grep -q 'jsName = "LocationGuard"' ios/App/App/AppDelegate.swift || { echo "::error::LocationGuard is missing"; exit 1; }
          if grep -q 'download.petrokima-hr.com/Petrokima.apk\|const APK_REPO  = "P' ios/App/App/public/app.js; then echo "::error::The iPhone app must not carry the Android download address"; exit 1; fi
          grep -q "const APP_BUILD = ${{ github.run_number }};" ios/App/App/public/app.js || { echo "::error::The build number was not written into the app"; exit 1; }
          echo "✔ no Always location, no background location, iOS 16, LocationGuard inside, no Android download address, build ${{ github.run_number }}"

      # ── test build: simulator, no signing ──
      - name: Build for the iPhone simulator (no signing)
        if: steps.kind.outputs.signed != '1'
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Check the built app
        if: steps.kind.outputs.signed != '1'
        run: |
          APP=$(ls -d build/dd/Build/Products/Release-iphonesimulator/App.app)
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::The privacy file is missing from the app"; exit 1; }
          grep -q 'NSPrivacyAccessedAPICategorySystemBootTime' "$APP/PrivacyInfo.xcprivacy" || { echo "::error::The privacy file does not declare the counter"; exit 1; }
          grep -q 'NSPrivacyTrackingDomains' "$APP/PrivacyInfo.xcprivacy" || { echo "::error::The privacy file looks wrong"; exit 1; }
          test -f "$APP/public/react.js" || { echo "::error::react.js is missing from the app"; exit 1; }
          strings "$APP/App" | grep -q LocationGuardPlugin || { echo "::error::LocationGuardPlugin was not compiled into the app"; exit 1; }
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"); B=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          echo "✔ built: version $V (build $B)"
          [ "$B" = "${{ github.run_number }}" ] || { echo "::error::Build number $B is not ${{ github.run_number }}"; exit 1; }

      - name: Start it on a simulated iPhone (it must still be running after 20 seconds)
        if: steps.kind.outputs.signed != '1'
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')).devices; const l=Object.entries(d).filter(([r])=>/iOS-(1[6-9]|2[0-9])/.test(r)).flatMap(([,v])=>v).filter(x=>/iPhone/.test(x.name)); console.log((l.pop()||{}).udid||'')")
          if [ -z "$UDID" ]; then echo "::warning::No simulated iPhone found on this computer — start test skipped"; exit 0; fi
          xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/dd/Build/Products/Release-iphonesimulator/App.app
          xcrun simctl launch "$UDID" com.petrokima.hr
          sleep 20
          if xcrun simctl spawn "$UDID" launchctl list | grep -q 'com.petrokima.hr'; then echo "✔ the app is running on the simulated iPhone"; else
            xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "App"' --style compact | tail -40 || true
            echo "::error::The app stopped on the simulated iPhone"; exit 1; fi
          xcrun simctl io "$UDID" screenshot build/first-screen.png || true

      - name: Keep the first screen picture
        if: steps.kind.outputs.signed != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2 — pinned
        with:
          name: iphone-simulator-${{ github.run_number }}
          path: build/first-screen.png
          if-no-files-found: ignore
          retention-days: 14

      # ── TestFlight build: Apple's cloud signing with the App Store Connect key, uploaded to TestFlight ──
      - name: Build, sign and upload to TestFlight
        if: steps.kind.outputs.signed == '1'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"; umask 077; printf '%s' "$P8" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive "${AUTH[@]}" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} archive | tail -40
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/ExportOptions.plist -exportPath build/export "${AUTH[@]}" | tail -40
          echo "::notice::iPhone app 1.0.${{ github.run_number }} (build ${{ github.run_number }}) uploaded to TestFlight — Apple checks it (usually 10–30 minutes), then testers can install it"
