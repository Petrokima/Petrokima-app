# Builds the Petrokima Android app on GitHub's computers and publishes it as a download.
# Runs automatically when files change, or by hand: Actions → "Build Android app" → Run workflow.
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Arrange the files into their folders (in case they were uploaded without folders)
        run: |
          mkdir -p scripts web assets
          for f in prepare-web.js patch-android.js patch-ios.js; do if [ -f "$f" ]; then mv -f "$f" scripts/; fi; done
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do if [ -f "$f" ]; then mv -f "$f" web/; fi; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do if [ -f "$f" ]; then mv -f "$f" assets/; fi; done
          echo "scripts: $(ls scripts | tr '\n' ' ')"; echo "web: $(ls web | tr '\n' ' ')"; echo "assets: $(ls assets | tr '\n' ' ')"
          for f in scripts/prepare-web.js scripts/patch-android.js web/index.html assets/icon-only.png assets/icon-foreground.png assets/icon-background.png assets/splash.png; do
            if [ ! -f "$f" ]; then echo "::error::The file $(basename "$f") is missing from the repository — please upload it"; exit 1; fi
          done

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check the Android tools (already installed on GitHub's computers)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then echo "::error::Android tools were not found on this computer"; exit 1; fi
          echo "Android tools found at $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null 2>&1 || true; fi

      - name: Install the app libraries
        run: npm ci

      - name: Prepare the app (key, build number)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_BUILD: ${{ github.run_number }}
          APK_REPO: ${{ github.repository }}
          APK_DOWNLOAD: ${{ vars.DOWNLOAD_DOMAIN && format('https://{0}/Petrokima.apk', vars.DOWNLOAD_DOMAIN) || '' }}
        run: node scripts/prepare-web.js

      - name: Create the Android project
        run: npx cap add android

      - name: App icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#1f4fb5' --iconBackgroundColorDark '#1f4fb5' --splashBackgroundColor '#f3f5f9' --splashBackgroundColorDark '#f3f5f9'

      - name: Location permission, version number, signing
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/patch-android.js

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::The secret ANDROID_KEYSTORE_BASE64 is missing — see README step 3"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/petrokima-release.jks"

      - name: Build the app
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/petrokima-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Petrokima.apk

      - name: Build the download page
        run: |
          mkdir -p site
          cp Petrokima.apk site/Petrokima.apk
          PAGE=$(ls download-page.html download/download-page.html 2>/dev/null | head -1)
          if [ -z "$PAGE" ]; then echo "::error::download-page.html is missing from the repository"; exit 1; fi
          sed -e "s#__APP_URL__#${APP_URL:-https://petrokima.github.io/hr/}#g" -e "s#__VERSION__#1.0.${{ github.run_number }}#g" "$PAGE" > site/index.html
          cp web/icon-192.png site/icon-192.png 2>/dev/null || true
          if [ -n "${DOWNLOAD_DOMAIN}" ]; then echo "${DOWNLOAD_DOMAIN}" > site/CNAME; fi
        env:
          APP_URL: ${{ vars.APP_URL }}
          DOWNLOAD_DOMAIN: ${{ vars.DOWNLOAD_DOMAIN }}

      - name: Publish the download page (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Petrokima Android 1.0.${{ github.run_number }}
          body: |
            Petrokima attendance & HR — Android app, version 1.0.${{ github.run_number }}.
            Download link for employees (always the newest version):
            https://github.com/${{ github.repository }}/releases/latest/download/Petrokima.apk
          files: Petrokima.apk
          make_latest: true
