# Builds the Petrokima Android app on GitHub's computers and publishes it as a download.
# Runs automatically when files change, or by hand: Actions → "Build Android app" → Run workflow.
name: Build Android app

on:
  push:
    branches: [main, 'test/**']      # test/… branches build a TEST app only (see the last step)
  workflow_dispatch:

permissions:
  contents: write

# one build at a time: a second upload waits for the first build to finish (no clash when publishing the download page)
concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    # Two versions from the same files (24 Nov 2026): 'download' = the APK on the download page, exactly as before;
    # 'store' = the Google Play bundle (.aab): no background location, no self-update banner (Play rule). Same signing key.
    strategy:
      fail-fast: false
      matrix:
        variant: [download, store]
    name: Android (${{ matrix.variant }})
    steps:
      - name: Get the project files
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0 — pinned to the exact commit (supply-chain rule)

      - name: Arrange the files into their folders (in case they were uploaded without folders)
        run: |
          mkdir -p scripts web assets
          for f in prepare-web.js patch-android.js patch-ios.js; do if [ -f "$f" ]; then mv -f "$f" scripts/; fi; done
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do if [ -f "$f" ]; then mv -f "$f" web/; fi; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do if [ -f "$f" ]; then mv -f "$f" assets/; fi; done
          echo "scripts: $(ls scripts | tr '\n' ' ')"; echo "web: $(ls web | tr '\n' ' ')"; echo "assets: $(ls assets | tr '\n' ' ')"
          for f in scripts/prepare-web.js scripts/patch-android.js web/index.html assets/icon-only.png assets/icon-foreground.png assets/icon-background.png assets/splash.png; do
            if [ ! -f "$f" ]; then echo "::error::The file $(basename "$f") is missing from the repository — please upload it"; exit 1; fi
          done

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0 — pinned
        with:
          node-version: 22
          cache: npm

      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961   # v5.7.0 — pinned
        with:
          distribution: temurin
          java-version: 21

      - name: Check the Android tools (already installed on GitHub's computers)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then echo "::error::Android tools were not found on this computer"; exit 1; fi
          echo "Android tools found at $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null 2>&1 || true; fi

      - name: Install the app libraries
        run: npm ci

      - name: Prepare the app (key, build number)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_BUILD: ${{ github.run_number }}
          APK_REPO: ${{ matrix.variant == 'download' && github.repository || '' }}
          APK_DOWNLOAD: ${{ matrix.variant == 'download' && vars.DOWNLOAD_DOMAIN && format('https://{0}/Petrokima.apk', vars.DOWNLOAD_DOMAIN) || '' }}
          ANDROID_STRICT_CSP: ${{ startsWith(github.ref, 'refs/heads/test/') && '1' || '' }}
        run: node scripts/prepare-web.js

      - name: Create the Android project
        run: npx cap add android

      - name: App icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#02102b' --iconBackgroundColorDark '#02102b' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#02102b'

      - name: Location permission, version number, signing
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          STORE_BUILD: ${{ matrix.variant == 'store' && '1' || '' }}
        run: node scripts/patch-android.js

      - name: Phone notifications (Firebase settings from the secret GOOGLE_SERVICES_JSON)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            node -e "const j=JSON.parse(require('fs').readFileSync('android/app/google-services.json','utf8')); if(!JSON.stringify(j).includes('com.petrokima.hr')) { console.error('::error::google-services.json is not for the package com.petrokima.hr'); process.exit(1); } console.log('Firebase settings added for project', j.project_info && j.project_info.project_id)"
          else
            echo "::warning::The secret GOOGLE_SERVICES_JSON is not set — this app is built WITHOUT phone notifications"
          fi

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::The secret ANDROID_KEYSTORE_BASE64 is missing — see README step 3"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/petrokima-release.jks"

      - name: Build the app
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/petrokima-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          TASK=assembleRelease; if [ "${{ matrix.variant }}" = "store" ]; then TASK=bundleRelease; fi
          # the public library server (Maven Central) sometimes answers "Too many requests" (429) when many builds run at once
          # (24 Nov 2026) — then wait 90 seconds and try ONCE more; what was already downloaded is kept, so the second try fetches less
          if ! ./gradlew "$TASK" --no-daemon --stacktrace; then
            echo "::warning::The Android build failed once (often the library server being busy) — trying again in 90 seconds"
            sleep 90
            ./gradlew "$TASK" --no-daemon --stacktrace
          fi

      - name: Remove the signing key file from the build computer
        if: always()
        run: rm -f "$RUNNER_TEMP/petrokima-release.jks"

      - name: Store version — check and keep the bundle for Google Play
        if: matrix.variant == 'store'
        run: |
          MF=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -1)
          if [ -z "$MF" ]; then echo "::error::The final AndroidManifest.xml of the store version was not found"; exit 1; fi
          if grep -q ACCESS_BACKGROUND_LOCATION "$MF"; then echo "::error::The store version must not ask for background location"; exit 1; fi
          if grep -q REQUEST_INSTALL_PACKAGES "$MF"; then echo "::error::The store version must not install other apps"; exit 1; fi
          if grep -q 'const APK_DOWNLOAD = "[^"]' www/app.js || grep -q 'const APK_REPO  = "[^"]' www/app.js; then echo "::error::The store version must not offer downloads outside Google Play"; exit 1; fi
          cp android/app/build/outputs/bundle/release/app-release.aab Petrokima-1.0.${{ github.run_number }}.aab
          echo "::notice::Google Play bundle ready: Petrokima-1.0.${{ github.run_number }}.aab (version code ${{ github.run_number }}) — download it from this run's 'Artifacts'"

      - name: Store version — attach the bundle to this run
        if: matrix.variant == 'store'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2 — pinned
        with:
          name: Petrokima-google-play-1.0.${{ github.run_number }}
          path: Petrokima-1.0.${{ github.run_number }}.aab
          retention-days: 30
          if-no-files-found: error

      # Automatic upload to Google Play (24 Nov 2026) — only from main, only once the secret PLAY_SERVICE_ACCOUNT_JSON exists (Play Console →
      # Setup → API access → a Google Cloud service account with "Release to testing tracks" rights; Mohammed saves its JSON key as a secret
      # of Petrokima-app — never in a file). Goes to the INTERNAL test track as a DRAFT by default: a person promotes it in Play Console
      # (internal → closed → production as a staged rollout). Repository variables PLAY_TRACK / PLAY_STATUS change that later.
      - name: Store version — is the Google Play upload switched on?
        id: play
        if: matrix.variant == 'store' && github.ref == 'refs/heads/main'
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_KEY" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "::notice::Google Play upload not switched on yet (secret PLAY_SERVICE_ACCOUNT_JSON missing) — upload the bundle by hand"; fi

      - name: Store version — upload to Google Play
        if: steps.play.outputs.on == '1'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5   # v1.1.5 (20 Apr 2026) — pinned
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.petrokima.hr
          releaseFiles: Petrokima-1.0.${{ github.run_number }}.aab
          releaseName: 1.0.${{ github.run_number }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STATUS || 'draft' }}

      - name: Name the file
        if: matrix.variant == 'download'
        run: cp android/app/build/outputs/apk/release/app-release.apk Petrokima.apk

      # Automatic real-device test (24 Nov 2026, best-practice step 7): Firebase Test Lab's "Robo" test installs the app on Google's
      # test phones (an older and a newer Android) and taps through what it can reach without a password (start-up, sign-in screen,
      # Forgot password, language switch). It catches an app that crashes or does not start before staff get it. Uses the Google
      # Cloud command tool already on GitHub's computers (no extra add-on). Switched on once the secret FIREBASE_TESTLAB_KEY and the
      # variable FIREBASE_PROJECT exist. Least privilege: a SEPARATE, empty Firebase project only for these tests (no staff data in it),
      # its service account with the role Editor (Google's requirement for the default results storage); or set the variable
      # TESTLAB_BUCKET (a storage bucket you own) and give only "Firebase Test Lab Admin" + "Firebase Analytics Viewer". Mohammed saves
      # the key himself — never in a file. Variable TESTLAB_DEVICES changes the phones. A CRASH stops the build before anything is
      # published; a problem of Test Lab itself (daily quota, Google outage) only warns, so a release is never held up by Google.
      - name: Real-device test — switched on?
        id: testlab
        if: matrix.variant == 'download'
        env:
          TL_KEY: ${{ secrets.FIREBASE_TESTLAB_KEY }}
          TL_PROJECT: ${{ vars.FIREBASE_PROJECT }}
        run: |
          if [ -n "$TL_KEY" ] && [ -n "$TL_PROJECT" ]; then echo "on=1" >> "$GITHUB_OUTPUT"; else echo "::notice::Real-device test not switched on yet (secret FIREBASE_TESTLAB_KEY / variable FIREBASE_PROJECT missing)"; fi

      - name: Real-device test (Firebase Test Lab, Robo)
        if: steps.testlab.outputs.on == '1'
        env:
          TL_KEY: ${{ secrets.FIREBASE_TESTLAB_KEY }}
          TL_PROJECT: ${{ vars.FIREBASE_PROJECT }}
          TL_DEVICES: ${{ vars.TESTLAB_DEVICES || 'model=MediumPhone.arm,version=30;model=MediumPhone.arm,version=34' }}
          TL_LABEL: 1.0.${{ github.run_number }}
          TL_BUCKET: ${{ vars.TESTLAB_BUCKET }}
        run: |
          KEY="$RUNNER_TEMP/testlab-key.json"
          ( umask 077; printf '%s' "$TL_KEY" > "$KEY" )
          trap 'rm -f "$KEY"; gcloud --quiet auth revoke --all >/dev/null 2>&1 || true' EXIT
          gcloud --quiet auth activate-service-account --key-file="$KEY"
          ARGS=(); IFS=';' read -ra DEVS <<< "$TL_DEVICES"; for d in "${DEVS[@]}"; do if [ -n "$d" ]; then ARGS+=(--device "$d"); fi; done
          if [ -n "$TL_BUCKET" ]; then ARGS+=(--results-bucket "$TL_BUCKET"); fi
          set +e
          gcloud --quiet firebase test android run --project "$TL_PROJECT" --type robo --app Petrokima.apk "${ARGS[@]}" \
            --timeout 5m --results-history-name "Petrokima HR" --client-details "matrixLabel=$TL_LABEL" 2>&1 | tee testlab.log
          code=${PIPESTATUS[0]}
          set -e
          case "$code" in
            0)  echo "::notice::Real-device test passed on: $TL_DEVICES" ;;
            10) echo "::error::Real-device test: the app crashed or failed on a test phone — nothing is published. Details: Firebase console → Test Lab → Petrokima HR"; exit 1 ;;
            *)  echo "::warning::Real-device test could not run (gcloud answered $code) — the release goes on; see this step's log" ;;
          esac

      - name: Build the download page
        if: matrix.variant == 'download' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp Petrokima.apk site/Petrokima.apk
          PAGE=$(ls download-page.html download/download-page.html 2>/dev/null | head -1)
          if [ -z "$PAGE" ]; then echo "::error::download-page.html is missing from the repository"; exit 1; fi
          sed -e "s#__APP_URL__#${APP_URL:-https://petrokima.github.io/hr/}#g" -e "s#__VERSION__#1.0.${{ github.run_number }}#g" "$PAGE" > site/index.html
          cp web/icon-192.png site/icon-192.png 2>/dev/null || true
          if [ -n "${DOWNLOAD_DOMAIN}" ]; then echo "${DOWNLOAD_DOMAIN}" > site/CNAME; fi
        env:
          APP_URL: ${{ vars.APP_URL }}
          DOWNLOAD_DOMAIN: ${{ vars.DOWNLOAD_DOMAIN }}

      - name: Publish the download page (GitHub Pages)
        if: matrix.variant == 'download' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453   # v4.1.0 — pinned (review)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

      - name: Publish the download
        if: matrix.variant == 'download' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2.6.2 — pinned (review)
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Petrokima Android 1.0.${{ github.run_number }}
          body: |
            Petrokima attendance & HR — Android app, version 1.0.${{ github.run_number }}.
            Download link for employees (always the newest version):
            https://github.com/${{ github.repository }}/releases/latest/download/Petrokima.apk
          files: Petrokima.apk
          make_latest: true

      - name: Publish a TEST version (test/… branches only — not on the download page, never offered to staff)
        if: matrix.variant == 'download' && startsWith(github.ref, 'refs/heads/test/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # v2.6.2 — pinned (review)
        with:
          tag_name: test-1.0.${{ github.run_number }}
          name: TEST ONLY — Petrokima Android 1.0.${{ github.run_number }} (${{ github.ref_name }})
          body: |
            TEST version for one phone only — not for staff. Built from branch ${{ github.ref_name }}.
            Direct link: https://github.com/${{ github.repository }}/releases/download/test-1.0.${{ github.run_number }}/Petrokima.apk
          files: Petrokima.apk
          prerelease: true
          make_latest: false
